name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install C dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev

      - name: Run core test suite
        run: make test

  edge-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: example/edge/package-lock.json

      - name: Install edge dependencies
        working-directory: example/edge
        run: npm ci

      - name: Run edge runtime contract and debug tests
        working-directory: example/edge
        run: |
          npm run test:contract
          npm run test:contract-snapshot
          npm run test:trace
          npm run test:bytecode-debug
          npm run test:devtools-inline
          npm run test:browser-wasm-inline

      - name: Run runtime-wasm host contract test
        run: node runtime-wasm/test-host-contract.mjs

      - name: Run runtime-wasm host adapter test
        run: node runtime-wasm/test-host-adapter.mjs

      - name: Run browser-runtime host contract test
        run: node browser-runtime/test-runtime-contract.mjs

      - name: Run browser-runtime host adapter test
        run: node browser-runtime/test-host.mjs

  e2e-parity:
    runs-on: ubuntu-latest
    needs:
      - core
      - edge-unit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: example/edge/package-lock.json

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld libsqlite3-dev

      - name: Install edge dependencies
        working-directory: example/edge
        run: npm ci

      - name: Run JS/WASM parity matrix
        env:
          YGG_E2E: "1"
          YGG_PARITY_TIMEOUT: "60"
          YGG_PARITY_ORIGIN_PORT_BASE: "8400"
          YGG_PARITY_EDGE_PORT_BASE: "9000"
        run: make test_wasm_parity
