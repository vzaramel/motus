    </style><section class="playground-shell"><div class="playground-toolbar"><button type="button" id="playground-run" class="playground-run" title="Compile and Render" aria-label="Compile and Render">&#9654;</button><div id="playground-status" class="playground-status"></div></div><section class="playground-grid"><form id="playground-form" class="playground-form"><div id="playground-editor" class="playground-editor"></div><textarea id="playground-source" class="playground-source" spellcheck="false"></textarea></form><div id="playground-output" class="playground-output"></div></section></section><script>
        (function () {
            var form = document.getElementById('playground-form');
            var editorEl = document.getElementById('playground-editor');
            var sourceEl = document.getElementById('playground-source');
            var statusEl = document.getElementById('playground-status');
            var outputEl = document.getElementById('playground-output');
            var runButton = document.getElementById('playground-run');
            var editor = null;
            var ACE_CDN_URL = 'https://cdn.jsdelivr.net/npm/ace-builds@1.36.2/src-min-noconflict/ace.js';

            if (!form || !editorEl || !sourceEl || !statusEl || !outputEl || !runButton) return;

            var defaultSource = [
                '<defcomp DemoCard | title, body |>',
                '    <style>',
                '        .demo-card {',
                '            border: 1px solid #cbd5e1;',
                '            border-radius: 10px;',
                '            padding: 14px;',
                '            background: #ffffff;',
                '        }',
                '        .demo-card h3 {',
                '            margin: 0 0 8px 0;',
                '            color: #0f172a;',
                '        }',
                '        .demo-card p {',
                '            margin: 0;',
                '            color: #334155;',
                '            line-height: 1.5;',
                '        }',
                '    </style>',
                '    <article class="demo-card">',
                '        <h3><output title></h3>',
                '        <p><output body></p>',
                '    </article>',
                '</defcomp>',
                '',
                '<DemoCard',
                '    title="Playground Works"',
                '    body="Compiled at origin and rendered at edge through wasm VM." />'
            ].join('\n');

            sourceEl.value = defaultSource;

            function setupAceEditor() {
                editor = window.ace.edit('playground-editor');
                editor.session.setMode('ace/mode/html');
                editor.setTheme('ace/theme/tomorrow_night');
                editor.setOptions({
                    fontSize: '13px',
                    showPrintMargin: false,
                    useWorker: false,
                });
                editor.setValue(defaultSource, -1);
                editor.commands.addCommand({
                    name: 'run-playground',
                    bindKey: { win: 'Ctrl-Enter', mac: 'Command-Enter' },
                    exec: function () {
                        runPlayground();
                    },
                });
                editorEl.style.display = 'block';
                sourceEl.style.display = 'none';
            }

            function useTextareaFallback() {
                editorEl.style.display = 'none';
                sourceEl.style.display = 'block';
            }

            function readSource() {
                if (editor) return editor.getValue();
                return sourceEl.value || '';
            }

            function loadAceEditorIfNeeded() {
                if (window.ace && typeof window.ace.edit === 'function') {
                    setupAceEditor();
                    return Promise.resolve();
                }
                return new Promise(function (resolve) {
                    var script = document.createElement('script');
                    script.src = ACE_CDN_URL;
                    script.async = true;
                    script.onload = resolve;
                    script.onerror = resolve;
                    document.head.appendChild(script);
                }).then(function () {
                    if (window.ace && typeof window.ace.edit === 'function') {
                        setupAceEditor();
                    } else {
                        useTextareaFallback();
                    }
                });
            }

            async function runPlayground() {
                var source = readSource();
                if (!source.trim()) {
                    statusEl.textContent = 'Source is empty.';
                    outputEl.innerHTML = '';
                    return;
                }

                runButton.disabled = true;
                statusEl.textContent = 'Compiling...';

                try {
                    var response = await fetch('/_mot/playground/render', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ source: source }),
                    });
                    var payload = await response.json().catch(function () { return {}; });
                    if (!response.ok) {
                        throw new Error(payload.error || ('Request failed with status ' + response.status));
                    }
                    outputEl.innerHTML = payload.html || '';
                    statusEl.textContent = 'Done';
                } catch (err) {
                    statusEl.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
                    outputEl.innerHTML = '';
                } finally {
                    runButton.disabled = false;
                }
            }

            form.addEventListener('submit', function (event) {
                event.preventDefault();
                runPlayground();
            });

            runButton.addEventListener('click', function () {
                runPlayground();
            });

            sourceEl.addEventListener('keydown', function (event) {
                var isEnter = event.key === 'Enter';
                if (!isEnter) return;
                if (!event.ctrlKey && !event.metaKey) return;
                event.preventDefault();
                runPlayground();
            });

            loadAceEditorIfNeeded().then(runPlayground);
        })();

<!-- Motus Edge Runtime | vm: wasm | 30137 bytes | deps: none -->
<script data-mot-dev="live-reload">
(function() {
  var es, timer;
  function connect() {
    es = new EventSource('/_mot/dev/events');
    es.addEventListener('change', function() {
      console.log('[mot-dev] Content changed, reloading...');
      window.location.reload();
    });
    es.addEventListener('connected', function() {
      console.log('[mot-dev] Live-reload connected');
    });
    es.onerror = function() {
      es.close();
      clearTimeout(timer);
      timer = setTimeout(connect, 2000);
    };
  }
  connect();
})();
</script>
